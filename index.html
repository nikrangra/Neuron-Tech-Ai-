<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neuron Tech AI Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon">✦</div>
      <span>Neuron Tech AI</span>
    </div>

    <button class="new-chat" onclick="newChat()">
      ＋ New chat
    </button>

    <div class="menu">
      <button onclick="showHome()">⌂ Home</button>
      <button onclick="focusChat()">💬 Chats</button>
      <button onclick="startVoice()">🎙 Voice</button>
      <button onclick="openImage()">🖼 Images</button>
    </div>

    <div class="sidebar-bottom">
      <button onclick="toggleTheme()">🌙 Theme</button>
      <button onclick="openSettings()">⚙ Settings</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">

    <!-- Header -->
    <header class="header">
      <button class="mobile-menu" onclick="toggleSidebar()">☰</button>

      <div>
        <h2>Neuron Tech </h2>
        <small>AI Assistant</small>
      </div>

      <div class="header-actions">
        <button onclick="startVoice()">🎙</button>
        <button onclick="openSettings()">⚙</button>
      </div>
    </header>

    <!-- Chat -->
    <section class="chat" id="chat">

      <div class="welcome" id="welcome">
        <div class="big-logo">✦</div>
        <h1>How can I help you?</h1>
        <p>Ask me anything.</p>

        <div class="suggestions">
          <button onclick="quickAsk('Explain artificial intelligence')">
            🤖 Learn AI
          </button>

          <button onclick="quickAsk('Help me write a program')">
            💻 Coding
          </button>

          <button onclick="quickAsk('Give me a study plan')">
            📚 Study
          </button>

          <button onclick="quickAsk('Give me creative ideas')">
            💡 Ideas
          </button>
        </div>
      </div>

    </section>

    <!-- Input -->
    <div class="input-area">

      <div class="input-box">

        <button class="icon-btn" onclick="openImage()" title="Upload">
          ＋
        </button>

        <input
          id="messageInput"
          type="text"
          placeholder="Type Neuron Tech AI..."
          onkeydown="handleEnter(event)"
        >

        <button class="icon-btn" onclick="startVoice()" title="Voice">
          🎙
        </button>

        <button class="send-btn" onclick="sendMessage()" title="Send">
          ➤
        </button>

      </div>

      <p class="disclaimer">
        AI can make mistakes. Check important information.
      </p>

    </div>

  </main>
</div>

<!-- Hidden image input -->
<input
  type="file"
  id="imageInput"
  accept="image/*"
  hidden
  onchange="imageSelected(event)"
>

<!-- Settings -->
<div class="modal" id="settingsModal">

  <div class="settings">

    <div class="modal-header">
      <h2>Settings</h2>
      <button onclick="closeSettings()">✕</button>
    </div>

    <label>
      Theme
      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
      </select>
    </label>

    <button class="danger" onclick="clearChat()">
      🗑 Clear conversation
    </button>

    <button onclick="showAbout()">
      ℹ About Neuron Tech AI
    </button>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
